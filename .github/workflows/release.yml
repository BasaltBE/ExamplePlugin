name: Build and Release Plugin

on:
  push:

permissions:
  contents: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: plugins/ExamplePlugin/ExamplePlugin.csproj

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Read plugin version
        id: version
        run: |
          source="$GITHUB_WORKSPACE/plugin/ExamplePlugin.cs"
          test -f "$source"
          version=$(sed -n 's:.*Plugin("[^"]*", "\([^"]*\)".*:\1:p' "$source" | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        id: release
        run: |
          if git ls-remote --tags "https://github.com/${{ github.repository }}.git" "refs/tags/v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Basalt
        uses: actions/checkout@v4
        with:
          repository: BasaltBE/Basalt
          ref: development
          path: basalt

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: basalt/plugins/ExamplePlugin

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build plugin
        working-directory: basalt
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --output publish

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Plugin v${{ needs.version.outputs.version }}
          generate_release_notes: true
          prerelease: true
          files: basalt/publish/ExamplePlugin.dll
